<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0b1120">
    <title>Calculadora de Comisiones</title>
    <link rel="stylesheet" href="ventas.css">
    <script src="ventas.js"></script>
    <script src="utilitarios.js"></script>
</head>

<body>

    <div class="contenedor">
        <h1>Calculadora de Comisiones</h1>

        <label for="txtSueldoBase">Salario Base:</label>
        <div class="input-group">
            <input type="text" id="txtSueldoBase" onblur="validarInput(this)">
            <span class="error-msg" id="error-txtSueldoBase"></span>
        </div>

        <label for="txtVentas">Número de ventas:</label>
        <div class="input-group">
            <input type="text" id="txtVentas" onblur="validarInput(this)">
            <span class="error-msg" id="error-txtVentas"></span>
        </div>

        <label for="txtPrecio">Precio del producto:</label>
        <div class="input-group">
            <input type="text" id="txtPrecio" onblur="validarInput(this)">
            <span class="error-msg" id="error-txtPrecio"></span>
        </div>

        <button onclick="calcular()">Calcular Comisión</button>

        <h2>Resultados</h2>
        <p>Salario Base: <span id="spSueldoBase"></span></p>
        <p>Comisión: <span id="spComision"></span></p>
        <p>Total: <span id="spTotal"></span></p>
    </div>

</body>

</html>
